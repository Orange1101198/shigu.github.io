            const LEDGER_CATS_KEY = 'ledger_categories';
            let ledgerList = getData(LEDGER_KEY, []);
            let ledgerCategories = getData(LEDGER_CATS_KEY, ['食物', '服饰', '学习', '消耗品', '化妆', '电子产品', '其他']);
            let ledgerSummaryType = 'day';
            let ledgerDayView = new Date();
            let ledgerFilterCategory = 'all';

            function renderLedgerCatTags() {
                const container = document.getElementById('ledgerCatTags');
                const select = document.getElementById('ledgerCategorySelect');
                let html =
                    `<span class="cat-tag ${ledgerFilterCategory==='all'?'active':''}" data-cat="all">全部</span>`;
                ledgerCategories.forEach(cat => {
                    html +=
                        `<span class="cat-tag ${ledgerFilterCategory===cat?'active':''}" data-cat="${cat}">${cat} <span class="cat-del" data-cat="${cat}">✕</span></span>`;
                });
                container.innerHTML = html;
                select.innerHTML = ledgerCategories.map(c => `<option value="${c}">${c}</option>`).join('');

                container.querySelectorAll('.cat-tag').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.classList.contains('cat-del')) return;
                        const cat = this.dataset.cat;
                        ledgerFilterCategory = cat;
                        renderLedgerCatTags();
                        updateLedgerSummary(ledgerSummaryType);
                    });
                });
                container.querySelectorAll('.cat-del').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const cat = this.dataset.cat;
                        if (confirm(`确定删除分类 "${cat}" ？`)) {
                            ledgerCategories = ledgerCategories.filter(c => c !== cat);
                            save(LEDGER_CATS_KEY, ledgerCategories);
                            if (ledgerFilterCategory === cat) ledgerFilterCategory = 'all';
                            renderLedgerCatTags();
                            updateLedgerSummary(ledgerSummaryType);
                        }
                    });
                });
            }

            document.getElementById('addLedgerCat').addEventListener('click', function() {
                const val = document.getElementById('ledgerNewCat').value.trim();
                if (!val) return;
                if (ledgerCategories.includes(val)) { alert('分类已存在'); return; }
                ledgerCategories.push(val);
                save(LEDGER_CATS_KEY, ledgerCategories);
                document.getElementById('ledgerNewCat').value = '';
                renderLedgerCatTags();
            });

            function renderLedger() {
                const grid = document.getElementById('ledgerGrid');
                if (ledgerSummaryType !== 'day') {
                    grid.innerHTML = '';
                    grid.style.display = 'none';
                    return;
                }
                grid.style.display = 'grid';
                let filtered = ledgerList;
                if (ledgerFilterCategory !== 'all') filtered = filtered.filter(i => i.category === ledgerFilterCategory);
                const dateStr = formatDate(ledgerDayView);
                filtered = filtered.filter(i => i.date === dateStr);
                if (!filtered.length) {
                    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#a0b8c8;">当天无记录</div>';
                    return;
                }
                let html = '';
                filtered.forEach((item, idx) => {
                    const typeText = item.type === 'income' ? '📈 进账' : '📉 支出';
                    const sign = item.type === 'income' ? '+' : '-';
                    const color = item.type === 'income' ? '#1a6a3a' : '#8a2a2a';
                    html += `<div class="entry-card">
                                <div class="card-top">
                                    <div class="card-title">${item.name}</div>
                                    <span style="font-weight:700;color:${color};font-size:0.85rem;">${sign} ¥${item.amount.toFixed(2)}</span>
                                </div>
                                <div class="card-meta">
                                    <span>${typeText}</span>
                                    <span>🏷️ ${item.category||'其他'}</span>
                                </div>
                                <div class="card-actions">
                                    <button class="btn-edit" data-act="edit" data-idx="${idx}">✏️</button>
                                    <button class="btn-delete" data-act="delete" data-idx="${idx}">🗑️</button>
                                </div>
                            </div>`;
                });
                grid.innerHTML = html;
                const filteredList = filtered;
                grid.querySelectorAll('[data-act="edit"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = this.dataset.idx;
                        const item = filteredList[idx];
                        if (!item) return;
                        const oi = ledgerList.indexOf(item);
                        if (oi === -1) return;
                        openEditModal('ledger', oi, [
                            { key: 'name', label: '名称', type: 'text', value: item.name },
                            { key: 'amount', label: '金额', type: 'number', value: item.amount,
                                step: '0.01' },
                            { key: 'type', label: '类型', type: 'select', value: item.type,
                                options: [
                                    { value: 'income', text: '📈 进账' },
                                    { value: 'expense', text: '📉 支出' }
                                ] },
                            { key: 'category', label: '分类', type: 'select', value: item.category ||
                                    '其他', options: ledgerCategories.map(c => ({ value: c, text: c })) },
                            { key: 'date', label: '日期', type: 'date', value: item.date }
                        ], '编辑记账');
                    });
                });
                grid.querySelectorAll('[data-act="delete"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = this.dataset.idx;
                        const item = filteredList[idx];
                        if (!item) return;
                        const oi = ledgerList.indexOf(item);
                        if (oi === -1) return;
                        if (confirm('确定删除？')) { ledgerList.splice(oi, 1);
                            save(LEDGER_KEY, ledgerList);
                            updateLedgerSummary(ledgerSummaryType); }
                    });
                });
            }

            function updateLedger(id, updates) {
                if (id >= 0 && id < ledgerList.length) { Object.assign(ledgerList[id], updates);
                    save(LEDGER_KEY, ledgerList); return true; }
                return false;
            }

            function drawPie(canvasId, data, colors) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                const size = Math.min(rect.width || 180, 180);
                canvas.width = size;
                canvas.height = size;
                const cx = size / 2,
                    cy = size / 2,
                    r = size / 2 - 8;
                const total = data.reduce((s, v) => s + v, 0);
                if (total === 0) {
                    ctx.fillStyle = '#eee';
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#a0b8c8';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('无数据', cx, cy);
                    return;
                }
                let start = -Math.PI / 2;
                data.forEach((val, i) => {
                    const angle = (val / total) * 2 * Math.PI;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, r, start, start + angle);
                    ctx.closePath();
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fill();
                    start += angle;
                });
                const legendContainer = document.getElementById(`legend_${canvasId}`);
                if (legendContainer) {
                    const labels = document.getElementById(`labels_${canvasId}`)?.value?.split(',') || [];
                    let lhtml = '';
                    labels.forEach((label, i) => {
                        const val = data[i] || 0;
                        if (val > 0) {
                            lhtml +=
                                `<div class="legend-item"><span class="legend-color" style="background:${colors[i%colors.length]}"></span> ${label} (¥${val.toFixed(1)})</div>`;
                        }
                    });
                    legendContainer.innerHTML = lhtml || '<div style="color:#a0b8c8;">无数据</div>';
                }
            }

            function updateLedgerSummary(type) {
                ledgerSummaryType = type;
                const container = document.getElementById('ledgerSummaryContent');
                const now = new Date();
                let startDate, endDate;
                let label = '';

                if (type === 'day') {
                    const d = ledgerDayView;
                    startDate = new Date(d);
                    startDate.setHours(0, 0, 0, 0);
                    endDate = new Date(d);
                    endDate.setHours(23, 59, 59, 999);
                    label = formatDateCN(d);
                    const pickerHtml =
                        `<div class="date-nav" style="margin-bottom:0.5rem;">
                            <button id="ledgerDayPrev">◀</button>
                            <span class="date-label">${label}</span>
                            <button id="ledgerDayNext">▶</button>
                            <button class="btn-sm btn-outline" id="ledgerDayToday">今天</button>
                            <input type="date" id="ledgerDayPicker" style="flex:0 0 auto;width:auto;padding:0.2rem 0.5rem;border-radius:24px;border:1px solid rgba(180,210,230,0.3);font-size:0.75rem;" />
                            <button class="btn-sm btn-outline" id="ledgerDayGo">跳转</button>
                        </div>`;
                    container.innerHTML = pickerHtml + `<div id="ledgerDayContent"></div><div id="ledgerDayGrid"></div>`;
                    document.getElementById('ledgerDayPrev').addEventListener('click', function() {
                        ledgerDayView.setDate(ledgerDayView.getDate() - 1);
                        updateLedgerSummary('day');
                    });
                    document.getElementById('ledgerDayNext').addEventListener('click', function() {
                        ledgerDayView.setDate(ledgerDayView.getDate() + 1);
                        updateLedgerSummary('day');
                    });
                    document.getElementById('ledgerDayToday').addEventListener('click', function() {
                        ledgerDayView = new Date();
                        updateLedgerSummary('day');
                    });
                    document.getElementById('ledgerDayGo').addEventListener('click', function() {
                        const val = document.getElementById('ledgerDayPicker').value;
                        if (val) { ledgerDayView = new Date(val);
                            updateLedgerSummary('day'); }
                    });
                    document.getElementById('ledgerDayPicker').valueAsDate = ledgerDayView;

                    let dayItems = ledgerList.filter(item => {
                        const d = new Date(item.date);
                        return d >= startDate && d <= endDate;
                    });
                    if (ledgerFilterCategory !== 'all') dayItems = dayItems.filter(i => i.category === ledgerFilterCategory);
                    const income = dayItems.filter(i => i.type === 'income').reduce((s, i) => s + i.amount, 0);
                    const expense = dayItems.filter(i => i.type === 'expense').reduce((s, i) => s + i.amount, 0);
                    const balance = income - expense;
                    const content = document.getElementById('ledgerDayContent');
                    content.innerHTML =
                        `<div style="display:flex;gap:1.5rem;flex-wrap:wrap;padding:0.3rem 0;">
                            <span>📈 进账：<strong style="color:#1a6a3a;">¥${income.toFixed(2)}</strong></span>
                            <span>📉 支出：<strong style="color:#8a2a2a;">¥${expense.toFixed(2)}</strong></span>
                            <span>💰 结余：<strong style="color:#4a3a5a;">¥${balance.toFixed(2)}</strong></span>
                            <span style="font-size:0.7rem;color:#a0b8c8;">记录 ${dayItems.length} 笔</span>
                        </div>
                        <div style="margin-top:0.5rem;">
                            <div style="font-size:0.75rem;font-weight:600;color:#4a3a5a;">📊 分类支出分析</div>
                            <div class="pie-container">
                                <div class="pie-canvas-wrap">
                                    <canvas id="pie_day"></canvas>
                                </div>
                                <div class="pie-legend" id="legend_pie_day"></div>
                            </div>
                            <input type="hidden" id="labels_pie_day" value="${ledgerCategories.join(',')}" />
                        </div>`;
                    const catExpense = ledgerCategories.map(cat => {
                        return dayItems.filter(i => i.type === 'expense' && i.category === cat).reduce((s,
                            i) => s + i.amount, 0);
                    });
                    const colors = ['#7ab8d4', '#e8a040', '#4a9a7a', '#c05a5a', '#5a8ac0', '#c080c0', '#a0a0a0'];
                    setTimeout(() => drawPie('pie_day', catExpense, colors), 50);
                    renderLedger();
                    return;
                }

                if (type === 'week') {
                    const range = getWeekRange(now);
                    startDate = range.start;
                    endDate = range.end;
                    label = `第${getWeekNumber(now)}周 (${formatDateCN(startDate)} ~ ${formatDateCN(endDate)})`;
                } else if (type === 'month') {
                    startDate = new Date(now.getFullYear(), now.getMonth(), 1);
                    endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                    label = `${now.getFullYear()}年${now.getMonth()+1}月`;
                } else if (type === 'year') {
                    startDate = new Date(now.getFullYear(), 0, 1);
                    endDate = new Date(now.getFullYear(), 11, 31);
                    label = `${now.getFullYear()}年`;
                }

                let filtered = ledgerList.filter(item => {
                    const d = new Date(item.date);
                    return d >= startDate && d <= endDate;
                });
                if (ledgerFilterCategory !== 'all') filtered = filtered.filter(i => i.category === ledgerFilterCategory);
                const income = filtered.filter(i => i.type === 'income').reduce((s, i) => s + i.amount, 0);
                const expense = filtered.filter(i => i.type === 'expense').reduce((s, i) => s + i.amount, 0);
                const balance = income - expense;

                container.innerHTML = `
                    <div style="display:flex;gap:1.5rem;flex-wrap:wrap;padding:0.3rem 0;">
                        <span>📅 ${label}</span>
                        <span>📈 进账：<strong style="color:#1a6a3a;">¥${income.toFixed(2)}</strong></span>
                        <span>📉 支出：<strong style="color:#8a2a2a;">¥${expense.toFixed(2)}</strong></span>
                        <span>💰 结余：<strong style="color:#4a3a5a;">¥${balance.toFixed(2)}</strong></span>
                        <span style="font-size:0.7rem;color:#a0b8c8;">记录 ${filtered.length} 笔</span>
                    </div>
                    <div style="margin-top:0.5rem;">
                        <div style="font-size:0.75rem;font-weight:600;color:#4a3a5a;">📊 分类支出分析</div>
                        <div class="pie-container">
                            <div class="pie-canvas-wrap">
                                <canvas id="pie_summary"></canvas>
                            </div>
                            <div class="pie-legend" id="legend_pie_summary"></div>
                        </div>
                        <input type="hidden" id="labels_pie_summary" value="${ledgerCategories.join(',')}" />
                    </div>
                `;
                const catExpense = ledgerCategories.map(cat => {
                    return filtered.filter(i => i.type === 'expense' && i.category === cat).reduce((s, i) => s +
                        i.amount, 0);
                });
                const colors = ['#7ab8d4', '#e8a040', '#4a9a7a', '#c05a5a', '#5a8ac0', '#c080c0', '#a0a0a0'];
                setTimeout(() => drawPie('pie_summary', catExpense, colors), 50);
                document.getElementById('ledgerGrid').style.display = 'none';
                document.getElementById('ledgerGrid').innerHTML = '';
            }

            document.getElementById('addLedger').addEventListener('click', function() {
                const type = document.getElementById('ledgerType').value;
                const category = document.getElementById('ledgerCategorySelect').value;
                const name = document.getElementById('ledgerName').value.trim();
                const amount = parseFloat(document.getElementById('ledgerAmount').value);
                const date = document.getElementById('ledgerDate').value;
                if (!name || isNaN(amount) || !date) return;
                ledgerList.push({ type, name, amount, date, category });
                save(LEDGER_KEY, ledgerList);
                document.getElementById('ledgerName').value = '';
                document.getElementById('ledgerAmount').value = '';
                updateLedgerSummary(ledgerSummaryType);
            });

            document.querySelectorAll('#ledgerSummaryTabs .filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#ledgerSummaryTabs .filter-btn').forEach(b => b.classList.remove(
                        'active'));
                    this.classList.add('active');
                    const type = this.dataset.summary;
                    if (type === 'day') { ledgerDayView = new Date(); }
                    updateLedgerSummary(type);
                });
            });

            document.getElementById('ledgerDate').valueAsDate = new Date();
            renderLedgerCatTags();
            setTimeout(() => updateLedgerSummary('day'), 100);

            // 激活事件标签
            document.querySelector('[data-tab="events"]')?.click();

        })();
    </script>
</body>
</html>
