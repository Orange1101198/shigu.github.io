<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 全能备忘录</title>
    <style>
        /* ===== 白色背景 + 蓝色马卡龙UI ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: center;
        }
        .app {
            width: 100%;
            max-width: 1400px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 2.8rem;
            padding: 1.8rem 2rem 1.5rem;
            box-shadow: 0 20px 60px rgba(100, 150, 200, 0.08);
            border: 1px solid rgba(200, 225, 240, 0.4);
            min-height: 95vh;
            display: flex;
            flex-direction: column;
        }
        .header-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2a5a7a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(180, 210, 230, 0.3);
            letter-spacing: -0.5px;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(180, 210, 230, 0.3);
            padding-bottom: 0.3rem;
            overflow-x: auto;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #5a7a8a;
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }
        .tab-btn:hover {
            background: rgba(180, 210, 230, 0.15);
        }
        .tab-btn.active {
            color: #3a7a9a;
            border-bottom-color: #7ab8d4;
            background: rgba(180, 210, 230, 0.1);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 0.5rem;
        }
        .tab-pane {
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .tab-pane.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0.4;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 蓝色马卡龙卡片 ===== */
        .card {
            background: rgba(240, 248, 255, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(200, 225, 240, 0.6);
            box-shadow: 0 4px 16px rgba(150, 190, 210, 0.06);
            transition: box-shadow 0.2s;
        }
        .card:hover {
            box-shadow: 0 8px 28px rgba(150, 190, 210, 0.1);
        }
        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2a5a7a;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ===== 蓝色马卡龙输入框 ===== */
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1rem;
            margin-bottom: 0.8rem;
            align-items: center;
        }
        .row label {
            font-weight: 600;
            color: #4a6a7a;
            font-size: 0.85rem;
            min-width: 60px;
        }
        .row input,
        .row select,
        .row textarea {
            flex: 1;
            min-width: 120px;
            padding: 0.6rem 1rem;
            border-radius: 24px;
            border: 1px solid rgba(180, 210, 230, 0.5);
            background: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            outline: none;
            transition: 0.25s;
            color: #2a4a5a;
            box-shadow: 0 2px 6px rgba(150, 190, 210, 0.04);
        }
        .row input:focus,
        .row select:focus,
        .row textarea:focus {
            border-color: #7ab8d4;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(130, 190, 220, 0.15);
        }
        .row input::placeholder,
        .row textarea::placeholder {
            color: #a0b8c8;
            font-weight: 300;
        }
        .row input[type="color"] {
            flex: 0 0 auto;
            width: 50px;
            padding: 0.2rem;
            min-width: unset;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* ===== 蓝色马卡龙按钮 ===== */
        .btn {
            background: #7ab8d4;
            color: #fff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 2px 12px rgba(100, 170, 200, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }
        .btn:hover {
            background: #6aa8c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 170, 200, 0.25);
        }
        .btn-sm {
            padding: 0.3rem 1.2rem;
            font-size: 0.78rem;
            border-radius: 100px;
        }
        .btn-outline {
            background: transparent;
            color: #4a7a8a;
            border: 1px solid rgba(180, 210, 230, 0.4);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(180, 210, 230, 0.1);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: #d09a9a;
        }
        .btn-danger:hover {
            background: #b08080;
        }
        .btn-success {
            background: #90c0a0;
        }
        .btn-success:hover {
            background: #70a080;
        }

        /* ===== 卡片网格（紧凑） ===== */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .entry-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 1.6rem;
            padding: 0.7rem 0.9rem 0.9rem;
            border: 1px solid rgba(200, 225, 240, 0.5);
            box-shadow: 0 2px 12px rgba(150, 190, 210, 0.04);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
        }
        .entry-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(150, 190, 210, 0.08);
            border-color: rgba(180, 210, 230, 0.4);
            background: rgba(255, 255, 255, 0.95);
        }
        .entry-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.4rem;
            margin-bottom: 0.2rem;
        }
        .entry-card .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #2a4a5a;
            word-break: break-word;
            flex: 1;
        }
        .entry-card .card-status {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .entry-card .card-meta {
            font-size: 0.75rem;
            color: #5a7a8a;
            margin: 0.2rem 0 0.4rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
        }
        .entry-card .card-actions {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            margin-top: auto;
        }
        .entry-card .card-actions button {
            border: none;
            background: rgba(180, 210, 230, 0.15);
            padding: 0.15rem 0.6rem;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #4a6a7a;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            flex: 1 0 auto;
            justify-content: center;
            border: 1px solid transparent;
        }
        .entry-card .card-actions button:hover {
            background: rgba(180, 210, 230, 0.25);
            transform: scale(1.02);
        }
        .entry-card .card-actions .btn-inc {
            background: rgba(120, 200, 160, 0.15);
            color: #2a6a4a;
        }
        .entry-card .card-actions .btn-inc:hover {
            background: rgba(120, 200, 160, 0.25);
        }
        .entry-card .card-actions .btn-dec {
            background: rgba(200, 150, 150, 0.12);
            color: #7a4a4a;
        }
        .entry-card .card-actions .btn-dec:hover {
            background: rgba(200, 150, 150, 0.2);
        }
        .entry-card .card-actions .btn-edit {
            background: rgba(160, 180, 230, 0.12);
            color: #4a5a7a;
        }
        .entry-card .card-actions .btn-edit:hover {
            background: rgba(160, 180, 230, 0.22);
        }
        .entry-card .card-actions .btn-delete {
            background: rgba(200, 120, 120, 0.08);
            color: #8a5a5a;
        }
        .entry-card .card-actions .btn-delete:hover {
            background: rgba(200, 120, 120, 0.18);
            color: #b04040;
        }

        /* ===== 标签 ===== */
        .tag {
            display: inline-block;
            padding: 0.15rem 0.7rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .tag-red {
            background: #f8d0d0;
            color: #8a3a3a;
        }
        .tag-orange {
            background: #f5e0b0;
            color: #7a5a1a;
        }
        .tag-green {
            background: #c8e6c8;
            color: #1a6a3a;
        }
        .tag-blue {
            background: #c0d8f0;
            color: #1a4a7a;
        }
        .tag-purple {
            background: #d4c0f0;
            color: #4a2a6a;
        }

        /* ===== 状态颜色（蓝色调） ===== */
        .status-watching {
            background: #c0d8f0;
            color: #1a4a7a;
        }
        .status-completed {
            background: #b5e6c3;
            color: #1d6a3a;
        }
        .status-on-hold {
            background: #f7e5b0;
            color: #7a5a1a;
        }
        .status-planning {
            background: #c0d8f0;
            color: #1a4a7a;
        }
        .status-dropped {
            background: #f0c8c8;
            color: #7a2a2a;
        }
        .status-reading {
            background: #c0d8f0;
            color: #1a4a7a;
        }

        /* ===== 日历（通用） ===== */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 0.5rem;
        }
        .calendar-day {
            background: rgba(240, 248, 255, 0.6);
            border-radius: 14px;
            padding: 0.3rem 0.2rem 0.1rem;
            min-height: 70px;
            text-align: center;
            font-size: 0.75rem;
            border: 1px solid rgba(180, 210, 230, 0.2);
            transition: 0.15s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .calendar-day:hover {
            background: rgba(180, 210, 230, 0.15);
        }
        .calendar-day .day-num {
            font-weight: 700;
            color: #2a4a5a;
            font-size: 0.85rem;
            margin-bottom: 2px;
        }
        .calendar-day .day-bars {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin-top: auto;
            padding-bottom: 2px;
            flex: 1;
            justify-content: flex-end;
        }
        .calendar-day .day-bar {
            height: 4px;
            border-radius: 2px;
            margin: 0 2px;
        }
        .calendar-day .empty-img {
            font-size: 0.6rem;
            color: #a0b8c8;
        }
        .calendar-weekday {
            text-align: center;
            font-weight: 700;
            color: #4a7a8a;
            font-size: 0.8rem;
            padding: 0.2rem 0;
        }

        /* ===== 绘画日历专用样式（增强适应性） ===== */
        .draw-calendar .calendar-day {
            min-height: 80px;
            cursor: pointer;
        }
        .draw-calendar .img-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            justify-content: center;
            margin-top: 2px;
        }
        .draw-calendar .img-grid img {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .draw-calendar .img-count {
            font-size: 0.6rem;
            color: #7a9aaa;
            margin-top: 2px;
        }
        /* 小屏设备优化 */
        @media (max-width: 640px) {
            .draw-calendar .calendar-day {
                min-height: 60px;
                padding: 0.2rem 0.1rem;
            }
            .draw-calendar .img-grid img {
                width: 20px;
                height: 20px;
            }
            .draw-calendar .day-num {
                font-size: 0.7rem;
            }
            .draw-calendar .img-count {
                font-size: 0.5rem;
            }
        }
        @media (min-width: 641px) and (max-width: 1024px) {
            .draw-calendar .calendar-day {
                min-height: 70px;
            }
            .draw-calendar .img-grid img {
                width: 26px;
                height: 26px;
            }
        }

        /* ===== 汇总条 ===== */
        .summary-box {
            background: rgba(180, 210, 230, 0.08);
            padding: 0.6rem 1rem;
            border-radius: 16px;
            margin-top: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
        }
        .summary-box span {
            font-weight: 600;
            color: #2a4a5a;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(40, 60, 80, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 1rem;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            max-width: 520px;
            width: 100%;
            padding: 1.8rem 2rem 1.8rem;
            border-radius: 2.4rem;
            box-shadow: 0 30px 80px rgba(60, 100, 130, 0.15);
            border: 1px solid rgba(200, 225, 240, 0.5);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-box h3 {
            font-size: 1.3rem;
            color: #2a5a7a;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .modal-box .row {
            margin-bottom: 0.8rem;
        }
        .modal-box .row label {
            min-width: 70px;
        }
        .modal-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.2rem;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 0.5rem 1.6rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-actions .btn-modal-save {
            background: #7ab8d4;
            color: #fff;
            box-shadow: 0 4px 12px rgba(100, 170, 200, 0.2);
        }
        .modal-actions .btn-modal-save:hover {
            background: #6aa8c4;
            transform: scale(1.02);
        }
        .modal-actions .btn-modal-cancel {
            background: rgba(180, 210, 230, 0.15);
            color: #4a6a7a;
        }
        .modal-actions .btn-modal-cancel:hover {
            background: rgba(180, 210, 230, 0.25);
        }

        /* ===== 筛选/标签 ===== */
        .filter-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .filter-group .filter-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(180, 210, 230, 0.3);
            padding: 0.2rem 1.2rem;
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #4a6a7a;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-group .filter-btn:hover {
            background: rgba(180, 210, 230, 0.2);
        }
        .filter-group .filter-btn.active {
            background: #7ab8d4;
            border-color: #7ab8d4;
            color: #fff;
            box-shadow: 0 4px 12px rgba(100, 170, 200, 0.2);
        }
        .filter-group .filter-btn .badge {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 100px;
            padding: 0 0.4rem;
            font-size: 0.65rem;
            margin-left: 0.2rem;
        }
        .filter-group .filter-btn.active .badge {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== 事件样式 ===== */
        .event-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 0.8rem;
            background: rgba(240, 248, 255, 0.5);
            border-radius: 16px;
            margin-bottom: 0.4rem;
            border-left: 4px solid #7ab8d4;
            transition: 0.15s;
        }
        .event-item:hover {
            background: rgba(240, 248, 255, 0.8);
        }
        .event-item .event-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #b0c8d8;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            background: #fff;
        }
        .event-item .event-check.done {
            background: #7ab8d4;
            border-color: #7ab8d4;
            color: #fff;
            font-size: 12px;
        }
        .event-item .event-check.done::after {
            content: "✓";
        }
        .event-item .event-text {
            flex: 1;
            font-size: 0.9rem;
            color: #2a4a5a;
        }
        .event-item .event-text.done-text {
            text-decoration: line-through;
            color: #a0b8c8;
        }
        .event-item .event-meta {
            font-size: 0.7rem;
            color: #7a9aaa;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .event-item .event-actions {
            display: flex;
            gap: 0.3rem;
        }
        .event-item .event-actions button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.7rem;
            color: #7a9aaa;
            padding: 0.1rem 0.3rem;
            border-radius: 8px;
            transition: 0.15s;
        }
        .event-item .event-actions button:hover {
            background: rgba(180, 210, 230, 0.2);
            color: #2a5a7a;
        }
        .event-item .event-priority {
            font-size: 0.6rem;
            padding: 0.1rem 0.5rem;
            border-radius: 100px;
            font-weight: 700;
        }
        .event-priority-high {
            background: #f8d0d0;
            color: #8a3a3a;
        }
        .event-priority-medium {
            background: #f5e0b0;
            color: #7a5a1a;
        }
        .event-priority-low {
            background: #c8e6c8;
            color: #1a6a3a;
        }

        /* ===== 子标签 ===== */
        .sub-tabs {
            display: flex;
            gap: 0.2rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid rgba(180, 210, 230, 0.2);
        }
        .sub-tabs .sub-tab {
            background: transparent;
            border: none;
            padding: 0.2rem 0.8rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: #5a7a8a;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.15s;
        }
        .sub-tabs .sub-tab:hover {
            background: rgba(180, 210, 230, 0.1);
        }
        .sub-tabs .sub-tab.active {
            background: rgba(180, 210, 230, 0.2);
            color: #3a7a9a;
        }

        /* ===== 标签栏（可点击筛选） ===== */
        .event-tag-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.8rem;
            margin-bottom: 0.8rem;
            padding: 0.3rem 0;
        }
        .event-tag-bar .etag {
            font-size: 0.75rem;
            padding: 0.15rem 0.8rem;
            border-radius: 100px;
            background: rgba(180, 210, 230, 0.08);
            color: #4a6a7a;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        .event-tag-bar .etag:hover {
            background: rgba(180, 210, 230, 0.2);
        }
        .event-tag-bar .etag.active {
            background: #7ab8d4;
            color: #fff;
            border-color: #7ab8d4;
        }
        .event-tag-bar .etag .num {
            font-weight: 700;
            margin-left: 0.2rem;
        }

        /* ===== 饼图 ===== */
        .pie-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .pie-canvas-wrap {
            position: relative;
            width: 180px;
            height: 180px;
        }
        .pie-canvas-wrap canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;

            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 0.75rem;
        }
        .pie-legend .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .pie-legend .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* ===== 分类管理标签（可点击筛选） ===== */
        .cat-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(180, 210, 230, 0.12);
            padding: 0.15rem 0.6rem;
            border-radius: 100px;
            font-size: 0.75rem;
            color: #4a6a7a;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        .cat-tag:hover {
            background: rgba(180, 210, 230, 0.25);
        }
        .cat-tag.active {
            background: #7ab8d4;
            color: #fff;
            border-color: #7ab8d4;
        }
        .cat-tag .cat-del {
            cursor: pointer;
            color: #d09a9a;
            font-weight: 700;
            font-size: 0.7rem;
            margin-left: 0.2rem;
        }
        .cat-tag .cat-del:hover {
            color: #b07070;
        }

        /* ===== 日期导航 ===== */
        .date-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .date-nav button {
            background: rgba(180, 210, 230, 0.08);
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #4a6a7a;
            transition: 0.15s;

        .date-nav button:hover {
            background: rgba(180, 210, 230, 0.2);
        }
        .date-nav .date-label {
            font-weight: 600;
            color: #2a4a5a;
            font-size: 0.85rem;
            min-width: 100px;
            text-align: center;
        }

        /* ===== 总结区域 ===== */
        .summary-textarea {
            width: 100%;
            border-radius: 24px;
            border: 1px solid rgba(180, 210, 230, 0.3);
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.6);
            outline: none;
            transition: 0.25s;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }
        .summary-textarea:focus {
            border-color: #7ab8d4;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(130, 190, 220, 0.12);
        }
        .summary-display {
            margin-top: 0.3rem;
            font-style: italic;
            color: #5a7a8a;
            padding: 0.3rem 0.6rem;
            background: rgba(240, 248, 255, 0.3);
            border-radius: 12px;
        }

        /* ===== 视图切换标签 ===== */
        .view-tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.8rem;
        }
        .view-tabs .view-tab {
            background: transparent;
            border: none;
            padding: 0.2rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #5a7a8a;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.15s;
        }
        .view-tabs .view-tab:hover {
            background: rgba(180, 210, 230, 0.1);
        }
        .view-tabs .view-tab.active {
            background: rgba(180, 210, 230, 0.2);
            color: #3a7a9a;
        }
        .event-type-badge {
            font-size: 0.6rem;
            padding: 0.1rem 0.4rem;
            border-radius: 100px;
            background: rgba(180, 210, 230, 0.2);

        }

        /* ===== 响应式（整体） ===== */

                border-radius: 1.6rem;

            .header-title {

            .tab-btn {

                padding: 0.3rem 0.7rem;
            }
            .row {

            }
            .row label {

            }
            .event-item {

            }
            .event-item .event-meta {

        }

            background: #9ab8c8;
        }

</head>

            // =============================================================
            function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

            function save(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

            function load(key) {
                try { return JSON.parse(localStorage.getItem(key)) || null; } catch (_) { return null; }
            }

            function getData(key, def) { const d = load(key); return d !== null ? d : def; }

            function formatDate(d) {
                const dt = new Date(d);
                return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
            }

            function formatDateCN(d) {
                const dt = new Date(d);
                return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
            }

            function getWeekNumber(d) {
                const dt = new Date(d);
                const start = new Date(dt.getFullYear(), 0, 1);
                const diff = (dt - start + (start.getTimezoneOffset() - dt.getTimezoneOffset()) * 60000) / 86400000;
                return Math.ceil((diff + start.getDay() + 1) / 7);
            }

            function getWeekRange(d) {
                const dt = new Date(d);
                const day = dt.getDay() || 7;
                const start = new Date(dt);
                start.setDate(dt.getDate() - day + 1);
                const end = new Date(start);
                end.setDate(start.getDate() + 6);
                return { start, end };
            }

            function isToday(d) {
                const today = new Date();
                return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today
                    .getDate();
            }

            function sameDay(d1, d2) {
                return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2
                    .getDate();
            }

            // 状态映射（用于追番追剧小说）
            const statusClassMap = {
                'watching': 'status-watching',
                'completed': 'status-completed',
                'on-hold': 'status-on-hold',
                'planning': 'status-planning',
                'dropped': 'status-dropped',
                'reading': 'status-reading',
                'using': 'status-watching',
                'used': 'status-completed',
                'discarded': 'status-dropped'
            };

            // =============================================================
            //  标签切换
            // =============================================================
            const tabBtns = document.querySelectorAll('.tab-btn');
            const panes = {
                events: document.getElementById('pane-events'),
                draw: document.getElementById('pane-draw'),
                anime: document.getElementById('pane-anime'),
                drama: document.getElementById('pane-drama'),
                novel: document.getElementById('pane-novel'),
                items: document.getElementById('pane-items'),
                ledger: document.getElementById('pane-ledger'),
                game: document.getElementById('pane-game')
            };

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tab = this.dataset.tab;
                    Object.keys(panes).forEach(k => panes[k].classList.toggle('active', k === tab));
                    if (tab === 'draw') renderDrawCalendar();
                    if (tab === 'items') { renderItems();
                        renderItemCatTags(); }
                    if (tab === 'ledger') { renderLedger();
                        renderLedgerCatTags();
                        updateLedgerSummary('day'); }
                    if (tab === 'anime') { renderAnime();
                        renderAnimeTags(); }
                    if (tab === 'drama') { renderDrama();
                        renderDramaTags(); }
                    if (tab === 'novel') { renderNovel();
                        renderNovelStatusBar(); }
                    if (tab === 'events') { renderEvents();
                        loadEventDaySummary();
                        loadEventYearSummary(); }
                });
            });

            // =============================================================
            //  模态框（通用）
            // =============================================================
            const editModal = document.getElementById('editModal');
            const editForm = document.getElementById('editForm');
            const editFields = document.getElementById('editFields');
            const modalTitle = document.getElementById('editModalTitle');
            const modalCancel = document.getElementById('modalCancel');
            let currentEditData = null;

            function openEditModal(module, id, fields, title) {
                currentEditData = { module, id, fields };
                modalTitle.textContent = title || '✏️ 编辑';
                let html = '';
                fields.forEach(f => {
                    const label = f.label || f.key;
                    const value = f.value !== undefined ? f.value : '';
                    let input = '';
                    if (f.type === 'select') {
                        const opts = f.options.map(o =>
                            `<option value="${o.value}" ${o.value===value?'selected':''}>${o.text}</option>`
                        ).join('');
                        input =
                            `<select id="edit_${f.key}" class="edit-field" data-key="${f.key}">${opts}</select>`;
                    } else if (f.type === 'date') {
                        input = `<input type="date" id="edit_${f.key}" class="edit-field" data-key="${f.key}" value="${value}" />`;
                    } else if (f.type === 'datetime-local') {
                        input =
                            `<input type="datetime-local" id="edit_${f.key}" class="edit-field" data-key="${f.key}" value="${value}" />`;
                    } else if (f.type === 'color') {
                        input =
                            `<input type="color" id="edit_${f.key}" class="edit-field" data-key="${f.key}" value="${value}" style="flex:0 0 50px;height:40px;border-radius:50%;padding:0.2rem;" />`;
                    } else if (f.type === 'textarea') {
                        input =
                            `<textarea id="edit_${f.key}" class="edit-field" data-key="${f.key}" rows="2">${value}</textarea>`;
                    } else {
                        input =
                            `<input type="${f.type||'text'}" id="edit_${f.key}" class="edit-field" data-key="${f.key}" value="${value}" ${f.step?`step="${f.step}"`:''} />`;
                    }
                    html += `<div class="row"><label>${label}</label>${input}</div>`;
                });
                editFields.innerHTML = html;
                editModal.classList.add('show');
            }

            function closeEditModal() { editModal.classList.remove('show');
                currentEditData = null; }
            modalCancel.addEventListener('click', closeEditModal);
            editModal.addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && editModal.classList.contains('show'))
                    closeEditModal(); });

            editForm.addEventListener('submit', function(e) {
                e.preventDefault();
                if (!currentEditData) return;
                const { module, id, fields } = currentEditData;
                const updates = {};
                fields.forEach(f => {
                    const el = document.getElementById(`edit_${f.key}`);
                    if (el) {
                        let val = el.value;
                        if (f.type === 'number') val = parseFloat(val) || 0;
                        updates[f.key] = val;
                    }
                });
                let success = false;
                if (module === 'event') success = updateEvent(id, updates);
                else if (module === 'anime') success = updateAnime(id, updates);
                else if (module === 'drama') success = updateDrama(id, updates);
                else if (module === 'novel') success = updateNovel(id, updates);
                else if (module === 'item') success = updateItem(id, updates);
                else if (module === 'ledger') success = updateLedger(id, updates);
                if (success) {
                    closeEditModal();
                    if (module === 'event') renderEvents();
                    else if (module === 'anime') { renderAnime();
                        renderAnimeTags(); } else if (module === 'drama') { renderDrama();
                        renderDramaTags(); } else if (module === 'novel') { renderNovel();
                        renderNovelStatusBar(); } else if (module === 'item') { renderItems();
                        renderItemCatTags(); } else if (module === 'ledger') { renderLedger();
                        renderLedgerCatTags();
                        updateLedgerSummary(document.querySelector('#ledgerSummaryTabs .active')?.dataset.summary ||
                            'day'); }
                }
            });

            // =============================================================
            //  1. 事件模块（升级版）
            // =============================================================
            const EVENTS_KEY = 'events_data';
            const EVENT_DAY_SUMMARY_KEY = 'event_day_summary';
            const EVENT_YEAR_SUMMARY_KEY = 'event_year_summary';
            let events = getData(EVENTS_KEY, []);
            events = events.map(e => {
                if (!e.type) e.type = 'task';
                if (e.type === 'task' && !e.date) e.date = formatDate(new Date());
                return e;
            });
            save(EVENTS_KEY, events);

            let eventSub = 'work';
            let eventDayView = new Date();
            let eventWeekView = new Date();
            let eventMonthView = new Date();

            document.querySelectorAll('#eventSubTabs .sub-tab').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#eventSubTabs .sub-tab').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    eventSub = this.dataset.sub;
                    renderEvents();
                });
            });

            document.getElementById('eventQuickType').addEventListener('change', function() {
                const type = this.value;
                document.getElementById('taskFields').style.display = type === 'task' ? 'flex' : 'none';
                document.getElementById('eventFields').style.display = type === 'event' ? 'flex' : 'none';
            });

            function getEventsBySub(sub) {
                return events.filter(e => e.sub === sub);
            }

            function renderEvents() {
                renderEventDay();
                renderEventWeek();
                renderEventMonth();
            }

            // ---- 当天 ----
            function renderEventDay() {
                const dateStr = formatDate(eventDayView);
                document.getElementById('eventDayLabel').textContent = formatDateCN(eventDayView) + (isToday(eventDayView) ?
                    ' (今天)' : '');

                const dayEvents = getEventsBySub(eventSub).filter(e => {
                    if (e.type === 'task') {
                        return e.date === dateStr;
                    } else {
                        const start = new Date(e.startDate);
                        const end = new Date(e.endDate);
                        const day = new Date(eventDayView);
                        return day >= start && day <= end;
                    }
                });

                renderDayList(dayEvents);
                renderDayCalendar(dayEvents);
            }

            function renderDayList(dayEvents) {
                const container = document.getElementById('eventDayList');
                const tasks = dayEvents.filter(e => e.type === 'task');
                const eventsList = dayEvents.filter(e => e.type === 'event');
                if (!tasks.length && !eventsList.length) {
                    container.innerHTML = '<div style="color:#a0b8c8;font-size:0.85rem;padding:0.5rem 0;">今天暂无事件 ✨</div>';
                    return;
                }
                let html = '';
                tasks.forEach((e, idx) => {
                    const done = e.done || false;
                    const priCls = e.priority === 'high' ? 'event-priority-high' : e.priority === 'medium' ?
                        'event-priority-medium' : 'event-priority-low';
                    const priText = e.priority === 'high' ? '紧急' : e.priority === 'medium' ? '重要' : '普通';
                    html += `<div class="event-item" style="border-left-color:#7ab8d4;">
                                <div class="event-check ${done?'done':''}" data-idx="${idx}" data-action="toggle-day"></div>
                                <span class="event-text ${done?'done-text':''}">${e.name}</span>
                                <span class="event-meta">
                                    <span>${e.time||'--:--'}</span>
                                    <span class="event-priority ${priCls}">${priText}</span>
                                    <span class="event-type-badge">📋</span>
                                    <span>🏷️ ${e.category||'未分类'}</span>
                                </span>
                                <div class="event-actions">
                                    <button data-action="edit-day" data-idx="${idx}">✏️</button>
                                    <button data-action="delete-day" data-idx="${idx}">🗑️</button>
                                </div>
                            </div>`;
                });
                eventsList.forEach((e, idx) => {
                    const done = e.done || false;
                    const priCls = e.priority === 'high' ? 'event-priority-high' : e.priority === 'medium' ?
                        'event-priority-medium' : 'event-priority-low';
                    const priText = e.priority === 'high' ? '紧急' : e.priority === 'medium' ? '重要' : '普通';
                    const color = e.color || '#7ab8d4';
                    html += `<div class="event-item" style="border-left-color:${color};">
                                <div class="event-check ${done?'done':''}" data-idx="${idx}" data-action="toggle-day"></div>
                                <span class="event-text ${done?'done-text':''}">${e.name}</span>
                                <span class="event-meta">
                                    <span>${e.startTime||''} - ${e.endTime||''}</span>
                                    <span class="event-priority ${priCls}">${priText}</span>
                                    <span class="event-type-badge">📅</span>
                                    <span>🏷️ ${e.category||'未分类'}</span>
                                </span>
                                <div class="event-actions">
                                    <button data-action="edit-day" data-idx="${idx}">✏️</button>
                                    <button data-action="delete-day" data-idx="${idx}">🗑️</button>
                                </div>
                            </div>`;
                });
                container.innerHTML = html;

                const allDayEvents = dayEvents;
                container.querySelectorAll('[data-action="toggle-day"]').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = this.dataset.idx;
                        if (allDayEvents[idx]) {
                            const origIdx = events.indexOf(allDayEvents[idx]);
                            if (origIdx !== -1) { events[origIdx].done = !events[origIdx].done;
                                save(EVENTS_KEY, events);
                                renderEvents(); }
                        }
                    });
                });
                container.querySelectorAll('[data-action="edit-day"]').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = this.dataset.idx;
                        const item = allDayEvents[idx];
                        if (!item) return;
                        const origIdx = events.indexOf(item);
                        if (origIdx === -1) return;
                        openEditEventModal(origIdx, item);
                    });
                });
                container.querySelectorAll('[data-action="delete-day"]').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = this.dataset.idx;
                        const item = allDayEvents[idx];
                        if (!item) return;
                        const origIdx = events.indexOf(item);
                        if (origIdx === -1) return;
                        if (confirm('确定删除？')) { events.splice(origIdx, 1);
                            save(EVENTS_KEY, events);
                            renderEvents(); }
                    });
                });
            }

            function renderDayCalendar(dayEvents) {
                const container = document.getElementById('eventDayCalendar');
                const day = new Date(eventDayView);
                const dayOfWeek = day.getDay() || 7;
                const startOfWeek = new Date(day);
                startOfWeek.setDate(day.getDate() - dayOfWeek + 1);
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);

                let html = `<div class="calendar-grid">`;
                const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
                weekdays.forEach(d => html += `<div class="calendar-weekday">${d}</div>`);

                const weekEvents = events.filter(e => e.type === 'event' && e.sub === eventSub);
                const dateMap = {};
                for (let d = new Date(startOfWeek); d <= endOfWeek; d.setDate(d.getDate() + 1)) {
                    const ds = formatDate(d);
                    dateMap[ds] = [];
                }
                weekEvents.forEach(e => {
                    const start = new Date(e.startDate);
                    const end = new Date(e.endDate);
                    for (let d = new Date(startOfWeek); d <= endOfWeek; d.setDate(d.getDate() + 1)) {
                        if (d >= start && d <= end) {
                            const ds = formatDate(d);
                            if (dateMap[ds]) dateMap[ds].push(e);
                        }
                    }
                });

                for (let d = new Date(startOfWeek); d <= endOfWeek; d.setDate(d.getDate() + 1)) {
                    const ds = formatDate(d);
                    const isToday = sameDay(d, eventDayView);
                    const eventsOnDay = dateMap[ds] || [];
                    const bars = eventsOnDay.map(e => {
                        const color = e.color || '#7ab8d4';
                        return `<div class="day-bar" style="background:${color};"></div>`;
                    }).join('');
                    html += `<div class="calendar-day" style="${isToday?'background:rgba(180,210,230,0.3);':''}">
                                <div class="day-num">${d.getDate()}</div>
                                <div class="day-bars">${bars}</div>
                            </div>`;
                }
                html += '</div>';
                container.innerHTML = html;
            }

            // ---- 当周 ----
            function renderEventWeek() {
                const range = getWeekRange(eventWeekView);
                const weekNum = getWeekNumber(eventWeekView);
                document.getElementById('eventWeekLabel').textContent =
                    `${formatDateCN(range.start)} ~ ${formatDateCN(range.end)}`;
                document.getElementById('weekLabel').textContent = `第 ${weekNum} 周`;

                const weekEvents = getEventsBySub(eventSub).filter(e => {
                    if (e.type === 'task') {
                        const d = new Date(e.date);
                        return d >= range.start && d <= range.end;
                    } else {
                        const start = new Date(e.startDate);
                        const end = new Date(e.endDate);
                        return !(end < range.start || start > range.end);
                    }
                });

                renderWeekList(weekEvents);
                renderWeekCalendar(weekEvents);
            }

            function renderWeekList(weekEvents) {
                const container = document.getElementById('eventWeekList');
                const tasks = weekEvents.filter(e => e.type === 'task');
                const eventsList = weekEvents.filter(e => e.type === 'event');
                if (!tasks.length && !eventsList.length) {
                    container.innerHTML = '<div style="color:#a0b8c8;font-size:0.85rem;padding:0.5rem 0;">本周暂无事件 🗓️</div>';
                    return;
                }
                let html = '';
                tasks.forEach((e, idx) => {
                    const done = e.done || false;
                    const priCls = e.priority === 'high' ? 'event-priority-high' : e.priority === 'medium' ?
                        'event-priority-medium' : 'event-priority-low';
                    const priText = e.priority === 'high' ? '紧急' : e.priority === 'medium' ? '重要' : '普通';
                    html += `<div class="event-item" style="border-left-color:#7ab8d4;">
                                <div class="event-check ${done?'done':''}" data-idx="${idx}" data-action="toggle-week"></div>
                                <span class="event-text ${done?'done-text':''}">${e.name}</span>
                                <span class="event-meta">
                                    <span>📅 ${e.date}</span>
                                    <span>${e.time||'--:--'}</span>
                                    <span class="event-priority ${priCls}">${priText}</span>
                                    <span class="event-type-badge">📋</span>
                                    <span>🏷️ ${e.category||'未分类'}</span>
                                </span>
                                <div class="event-actions">
                                    <button data-action="edit-week" data-idx="${idx}">✏️</button>
                                    <button data-action="delete-week" data-idx="${idx}">🗑️</button>
                                </div>
                            </div>`;
                });
                eventsList.forEach((e, idx) => {
                    const done = e.done || false;
                    const priCls = e.priority === 'high' ? 'event-priority-high' : e.priority === 'medium' ?
                        'event-priority-medium' : 'event-priority-low';
                    const priText = e.priority === 'high' ? '紧急' : e.priority === 'medium' ? '重要' : '普通';
                    const color = e.color || '#7ab8d4';
                    html += `<div class="event-item" style="border-left-color:${color};">
                                <div class="event-check ${done?'done':''}" data-idx="${idx}" data-action="toggle-week"></div>
                                <span class="event-text ${done?'done-text':''}">${e.name}</span>
                                <span class="event-meta">
                                    <span>📅 ${e.startDate} ~ ${e.endDate}</span>
                                    <span>${e.startTime||''} - ${e.endTime||''}</span>
                                    <span class="event-priority ${priCls}">${priText}</span>
                                    <span class="event-type-badge">📅</span>
                                    <span>🏷️ ${e.category||'未分类'}</span>
                                </span>
                                <div class="event-actions">
                                    <button data-action="edit-week" data-idx="${idx}">✏️</button>
                                    <button data-action="delete-week" data-idx="${idx}">🗑️</button>
                                </div>
                            </div>`;
                });
                container.innerHTML = html;

                const allWeekEvents = weekEvents;
                container.querySelectorAll('[data-action="toggle-week"]').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = this.dataset.idx;
                        if (allWeekEvents[idx]) {
                            const origIdx = events.indexOf(allWeekEvents[idx]);
                            if (origIdx !== -1) { events[origIdx].done = !events[origIdx].done;
                                save(EVENTS_KEY, events);
                                renderEvents(); }
                        }
                    });
                });
                container.querySelectorAll('[data-action="edit-week"]').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = this.dataset.idx;
                        const item = allWeekEvents[idx];
                        if (!item) return;
                        const origIdx = events.indexOf(item);
                        if (origIdx === -1) return;
                        openEditEventModal(origIdx, item);
                    });
                });
                container.querySelectorAll('[data-action="delete-week"]').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = this.dataset.idx;
                        const item = allWeekEvents[idx];
                        if (!item) return;
                        const origIdx = events.indexOf(item);
                        if (origIdx === -1) return;
                        if (confirm('确定删除？')) { events.splice(origIdx, 1);
                            save(EVENTS_KEY, events);
                            renderEvents(); }
                    });
                });
            }

            function renderWeekCalendar(weekEvents) {
                const container = document.getElementById('eventWeekCalendar');
                const range = getWeekRange(eventWeekView);
                let html = `<div class="calendar-grid">`;
                const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
                weekdays.forEach(d => html += `<div class="calendar-weekday">${d}</div>`);

                const eventsInWeek = weekEvents.filter(e => e.type === 'event');
                const dateMap = {};
                for (let d = new Date(range.start); d <= range.end; d.setDate(d.getDate() + 1)) {
                    const ds = formatDate(d);
                    dateMap[ds] = [];
                }
                eventsInWeek.forEach(e => {
                    const start = new Date(e.startDate);
                    const end = new Date(e.endDate);
                    for (let d = new Date(range.start); d <= range.end; d.setDate(d.getDate() + 1)) {
                        if (d >= start && d <= end) {
                            const ds = formatDate(d);
                            if (dateMap[ds]) dateMap[ds].push(e);
                        }
                    }
                });

                for (let d = new Date(range.start); d <= range.end; d.setDate(d.getDate() + 1)) {
                    const ds = formatDate(d);
                    const isToday = sameDay(d, new Date());
                    const eventsOnDay = dateMap[ds] || [];
                    const bars = eventsOnDay.map(e => {
                        const color = e.color || '#7ab8d4';
                        return `<div class="day-bar" style="background:${color};"></div>`;
                    }).join('');
                    html += `<div class="calendar-day" style="${isToday?'background:rgba(180,210,230,0.3);':''}">
                                <div class="day-num">${d.getDate()}</div>
                                <div class="day-bars">${bars}</div>
                            </div>`;
                }
                html += '</div>';
                container.innerHTML = html;
            }

            // ---- 当月 ----
            function renderEventMonth() {
                const year = eventMonthView.getFullYear();
                const month = eventMonthView.getMonth();
                const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
                document.getElementById('eventMonthLabel').textContent = `${year}年${month+1}月`;

                const monthEvents = getEventsBySub(eventSub).filter(e => {
                    if (e.type === 'task') {
                        return e.date && e.date.startsWith(monthStr);
                    } else {
                        const start = new Date(e.startDate);
                        const end = new Date(e.endDate);
                        const monthStart = new Date(year, month, 1);
                        const monthEnd = new Date(year, month + 1, 0);
                        return !(end < monthStart || start > monthEnd);
                    }
                });

                renderMonthList(monthEvents);
                renderMonthCalendar(monthEvents);
            }

            function renderMonthList(monthEvents) {
                const container = document.getElementById('eventMonthList');
                const tasks = monthEvents.filter(e => e.type === 'task');
                const eventsList = monthEvents.filter(e => e.type === 'event');
                if (!tasks.length && !eventsList.length) {
                    container.innerHTML = '<div style="color:#a0b8c8;font-size:0.85rem;padding:0.5rem 0;">本月暂无事件 📊</div>';
                    return;
                }
                let html = '';
                tasks.forEach((e, idx) => {
                    const done = e.done || false;
                    const priCls = e.priority === 'high' ? 'event-priority-high' : e.priority === 'medium' ?
                        'event-priority-medium' : 'event-priority-low';
                    const priText = e.priority === 'high' ? '紧急' : e.priority === 'medium' ? '重要' : '普通';

                        'event-priority-medium' : 'event-priority-low';

            function renderMonthCalendar(monthEvents) {
                const container = document.getElementById('eventMonthCalendar');
                const year = eventMonthView.getFullYear();
                const month = eventMonthView.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                let html = `<div class="calendar-grid">`;
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                weekdays.forEach(d => html += `<div class="calendar-weekday">${d}</div>`);
                for (let i = 0; i < firstDay; i++) {
                    html += `<div class="calendar-day" style="background:transparent;border:none;"></div>`;
                }

                const eventsInMonth = monthEvents.filter(e => e.type === 'event');
                const dateMap = {};
                for (let d = 1; d <= daysInMonth; d++) {
                    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    dateMap[ds] = [];
                }
                eventsInMonth.forEach(e => {
                    const start = new Date(e.startDate);
                    const end = new Date(e.endDate);
                    for (let d = 1; d <= daysInMonth; d++) {
                        const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        const cur = new Date(year, month, d);
                        if (cur >= start && cur <= end) {
                            if (dateMap[ds]) dateMap[ds].push(e);
                        }
                    }
                });

                const today = new Date();
                for (let d = 1; d <= daysInMonth; d++) {
                    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const isToday = (year === today.getFullYear() && month === today.getMonth() && d === today.getDate());
                    const eventsOnDay = dateMap[ds] || [];
                    const bars = eventsOnDay.map(e => {
                        const color = e.color || '#7ab8d4';
                        return `<div class="day-bar" style="background:${color};"></div>`;
                    }).join('');
                    html += `<div class="calendar-day" style="${isToday?'background:rgba(180,210,230,0.3);':''}">
                                <div class="day-num">${d}</div>
                                <div class="day-bars">${bars}</div>
                            </div>`;
                }
                html += '</div>';
                container.innerHTML = html;
            }

            const DRAW_DATA_KEY = 'draw_data';

            function renderDrawCalendar() {
                const container = document.getElementById('drawCalendarContainer');
                const month = document.getElementById('drawMonth').value;
                const category = document.getElementById('drawCategory').value;
                if (!month) return;
                const [year, mon] = month.split('-').map(Number);
                const firstDay = new Date(year, mon - 1, 1).getDay();
                const daysInMonth = new Date(year, mon, 0).getDate();
                let html =
                    `<div style="font-weight:600;margin-bottom:0.3rem;">${year}年${mon}月 (${category==='practice'?'练习':'接单'})</div>`;
                html += `<div class="calendar-grid">`;
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                weekdays.forEach(d => html += `<div class="calendar-weekday">${d}</div>`);
                for (let i = 0; i < firstDay; i++) {
                    html += `<div class="calendar-day" style="background:transparent;border:none;"></div>`;
                }
                const key = `${year}-${String(mon).padStart(2,'0')}`;
                const monthData = drawData[key] || {};
                const catData = monthData[category] || {};
                for (let d = 1; d <= daysInMonth; d++) {
                    const images = catData[d] || [];
                    let imgHtml = '';
                    if (images.length) {
                        imgHtml = `<div class="img-grid">`;
                        images.forEach(url => { imgHtml += `<img src="${url}" alt="绘画" />`; });
                        imgHtml += `</div>`;
                    } else {
                        imgHtml = `<div class="empty-img">📷</div>`;
                    }
                    html += `<div class="calendar-day" data-date="${year}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}" data-cat="${category}">
                                <div class="day-num">${d}</div>
                                ${imgHtml}
                                <div class="img-count">${images.length}/5</div>
                            </div>`;
                }
                html += '</div>';
                container.innerHTML = html;

                // 点击上传图片（保持不变）
                container.querySelectorAll('.calendar-day[data-date]').forEach(day => {
                    day.addEventListener('click', function() {
                        const date = this.dataset.date;
                        const cat = this.dataset.cat;
                        if (!date) return;
                        const [year, mon, dayNum] = date.split('-').map(Number);
                        const key = `${year}-${String(mon).padStart(2,'0')}`;
                        const currentImages = drawData[key]?.[cat]?.[dayNum] || [];
                        if (currentImages.length >= 5) { alert('每天最多上传 5 张图片！'); return; }
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'image/*';
                        input.onchange = function(e) {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                const dataUrl = ev.target.result;
                                if (!drawData[key]) drawData[key] = {};
                                if (!drawData[key][cat]) drawData[key][cat] = {};
                                if (!drawData[key][cat][dayNum]) drawData[key][cat][dayNum] = [];
                                drawData[key][cat][dayNum].push(dataUrl);
                                save(DRAW_DATA_KEY, drawData);
                                renderDrawCalendar();
                            };
                            reader.readAsDataURL(file);
                        };
                        input.click();
                    });
                });
            }
